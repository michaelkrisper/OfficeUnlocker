name: CI

# Lints and tests on every push and pull request; pushes to main are then
# published to krisperapps.de (only the files the page loads).

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Assemble site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          mkdir _site
          cp -r index.html utils.js ole2.js olelock.js pstunlock.js unlock.js vendor fonts _site/

      - name: Upload site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: _site
          retention-days: 1

  # The key may only write into this app's folder on the server, and this job
  # runs no code from the repository: it downloads the site, stamps the version
  # tag into index.html and rsyncs.
  server:
    name: krisperapps.de
    # Only commits that got a version tag: a re-run of an older run deploys nothing.
    if: needs.version.outputs.version != ''
    needs: [check, version]
    runs-on: ubuntu-latest
    concurrency:
      group: server
      cancel-in-progress: false
    steps:
      - name: Download site
        uses: actions/download-artifact@v8
        with:
          name: site
          path: _site

      - name: Stamp version
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          sed -i "s|<span id=\"version\">dev</span>|<span id=\"version\">${VERSION#v}</span>|" _site/index.html
          grep -q ">${VERSION#v}<" _site/index.html

      - name: Upload
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          echo 'krisperapps.de ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMchrlhQI1OFJ2cEfQosiydiSPg498c/+Mggebk+zVLO' > ~/.ssh/known_hosts
          rsync -rtz --delete -e 'ssh -i ~/.ssh/deploy' _site/ deploy@krisperapps.de:./

      - name: Smoke test
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          live="https://officeunlocker.krisperapps.de/"
          for f in "" unlock.js ole2.js olelock.js pstunlock.js utils.js vendor/jszip.min.js fonts/outfit-latin.woff2; do
            for attempt in 1 2 3 4 5; do
              code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$live$f" || echo 000)"
              [ "$code" = 200 ] && break
              sleep 5
            done
            echo "/$f -> $code"
            [ "$code" = 200 ] || { echo "::error::/$f returned $code"; exit 1; }
          done
          curl -s "$live" | grep -q ">${VERSION#v}<" || { echo "::error::index.html is not stamped with ${VERSION}"; exit 1; }

  # Tags every tested commit on main with the next patch version (vX.Y.Z).
  version:
    name: Version tag
    needs: [check]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: version-tag
      cancel-in-progress: false
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: tag
        run: python3 .github/scripts/release.py tag
        env:
          GH_TOKEN: ${{ github.token }}
