name: Dependabot auto-merge

# Merges Dependabot PRs once CI on the PR is green (major updates included).
# Without GitHub Pro private repos have no required checks, so this workflow
# waits for the successful CI run itself. Merges made with the GITHUB_TOKEN
# do not trigger push workflows, so the deploy is started afterwards via
# workflow_dispatch.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  merge:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      startsWith(github.event.workflow_run.head_branch, 'dependabot/')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SHA: ${{ github.event.workflow_run.head_sha }}
      BRANCH: ${{ github.event.workflow_run.head_branch }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Merge
        id: merge
        run: |
          set -euo pipefail
          pr=$(gh pr list --head "$BRANCH" --state open --json number,author \
            --jq '.[] | select(.author.login == "app/dependabot") | .number')
          if [ -z "$pr" ]; then
            echo "No open Dependabot PR for $BRANCH"
            exit 0
          fi
          gh pr merge "$pr" --squash --match-head-commit "$SHA"
          echo "merged=true" >> "$GITHUB_OUTPUT"
      # Deploy workflow(s) of this repo; they need a workflow_dispatch trigger.
      - name: Trigger deploy
        if: steps.merge.outputs.merged == 'true'
        run: gh workflow run static.yml --ref "$DEFAULT_BRANCH"
